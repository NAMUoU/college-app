{% extends "base.html" %}

{% block title %}Загрузка расписания{% endblock %}

{% block content %}
<div class="card" style="max-width: 600px; margin: 0 auto;">
    <div class="card-header">
        <h2>Загрузка расписания</h2>
    </div>
    
    <form method="POST" action="{{ url_for('upload_schedule') }}" enctype="multipart/form-data">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        
        <div class="form-group">
            <label for="schedule_file">Выберите файл Excel с расписанием</label>
            <input type="file" name="schedule_file" id="schedule_file" class="form-control" accept=".xlsx,.xls" required>
            <small class="form-text text-muted">Поддерживаются файлы .xlsx и .xls</small>
        </div>
        
        <div class="form-group">
            <button type="submit" class="btn btn-primary" style="width: 100%;">Загрузить расписание</button>
        </div>
    </form>
    
    <hr>
    
    <div class="alert alert-info">
        <strong>📌 Текущее расписание:</strong>
        <p>Студенты и преподаватели могут скачать его в разделе "Расписание" на главной странице.</p>
    </div>
</div>
{% endblock %}
